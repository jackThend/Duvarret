name: Publicación

# Al etiquetar una versión (git tag v1.0.0 && git push --tags) o a mano desde Actions:
# compila la obra insignia para Web y los tres sistemas, la adjunta a una release de GitHub y,
# si existen el secreto BUTLER_API_KEY y la variable ITCH_GAME (usuario/juego), la sube a itch.io.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Versión web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run duvarret -- export works/el-corazon-delator.duvarret --target web --zip --out publicar
      - uses: actions/upload-artifact@v4
        with:
          name: publicar-web
          path: publicar/

  nativo:
    name: Ejecutable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, canal: windows }
          - { os: macos-latest, canal: mac }
          - { os: ubuntu-22.04, canal: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Preparar certificado de firma (si existe)
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/ci-certificado.sh
      - run: npm run duvarret -- export works/el-corazon-delator.duvarret --target native --out publicar
        env:
          DUVARRET_WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: publicar-${{ matrix.canal }}
          path: publicar/native/

  publicar:
    name: Release e itch.io
    needs: [web, nativo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: publicar
      - name: Empaquetar los ejecutables
        run: |
          cd publicar
          for canal in windows mac linux; do
            chmod +x publicar-$canal/* || true
            (cd publicar-$canal && zip -q -r ../el-corazon-delator-$canal.zip .)
          done
          ls -la
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publicar/el-corazon-delator-*.zip
            publicar/publicar-web/*.zip
      - name: Subir a itch.io (si está configurado)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "Sin BUTLER_API_KEY o ITCH_GAME: no se sube a itch.io."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push publicar/publicar-web/web "$ITCH_GAME:html5" --userversion "$VERSION"
          for canal in windows mac linux; do
            ./butler/butler push "publicar/publicar-$canal" "$ITCH_GAME:$canal" --userversion "$VERSION"
          done
