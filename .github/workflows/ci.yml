name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, pruebas y E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run schema && git diff --exit-code schemas/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - run: npm run duvarret -- validate works/el-corazon-delator.duvarret
      - run: npm run duvarret -- export works/el-corazon-delator.duvarret --target web --zip --out export-ci
      - run: npm run duvarret -- export works/el-corazon-delator.duvarret --target audio --zip --out export-ci
      - uses: actions/upload-artifact@v4
        with:
          name: obra-insignia-web-y-audio
          path: export-ci/*.zip

  rust:
    name: Shell nativo (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: mkdir -p dist && cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  nativo:
    name: Ejecutable de la obra insignia (${{ matrix.os }})
    needs: [calidad, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      # Firma de código: solo si el repositorio tiene los secretos (ver docs/07_PUBLICACION.md).
      - name: Preparar certificado de firma (si existe)
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            pfx="$(cygpath -u "$RUNNER_TEMP")/firma.pfx"
            echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$pfx"
            echo "DUVARRET_WIN_CERT=$(cygpath -w "$pfx")" >> "$GITHUB_ENV"
            echo "Certificado de Windows listo."
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/firma.keychain-db"
            pass="$(openssl rand -hex 16)"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/firma.p12"
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            security import "$RUNNER_TEMP/firma.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/firma.p12"
            echo "DUVARRET_MAC_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "Certificado de Apple listo."
          else
            echo "Sin certificado: el ejecutable se publicará sin firmar."
          fi
      - run: npm run duvarret -- export works/el-corazon-delator.duvarret --target native --out export-ci
        env:
          DUVARRET_WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      - name: Comprobar tamaño (< 20 MB)
        shell: bash
        run: |
          f=$(ls export-ci/native/*)
          size=$(wc -c < "$f")
          echo "Tamaño: $size bytes"
          test "$size" -lt 20971520
      # RNF-02: memoria de la obra y, como referencia, del mismo shell con una página en blanco
      # (la base del motor web de cada sistema). Se informa en el resumen de la ejecución.
      - name: Memoria de la obra insignia
        shell: bash
        run: npm run medir-ram -- "$(ls export-ci/native/*)" --segundos 40 --solo-medir --nombre "Obra insignia" --informe export-ci/memoria-obra.json
      # Tab lleva el foco a «Comenzar» e Intro empieza la obra (teclas reales): se mide jugando, con el audio 3D.
      - name: Memoria de la obra insignia jugando
        shell: bash
        run: npm run medir-ram -- "$(ls export-ci/native/*)" --segundos 45 --tecla Tab@7 --tecla Enter@8 --solo-medir --nombre "Obra insignia jugando" --informe export-ci/memoria-jugando.json
      - name: Memoria de una página en blanco (base del motor web)
        shell: bash
        run: |
          mkdir -p export-ci/blanco
          echo '<!doctype html><meta charset="utf-8"><title>Blanco</title>' > export-ci/blanco/index.html
          CFG=$(node -p "JSON.stringify({productName:'Blanco',identifier:'engine.duvarret.blanco',build:{frontendDist:require('path').resolve('export-ci/blanco'),beforeBuildCommand:'',beforeDevCommand:''},bundle:{active:false}})")
          npx tauri build --no-bundle --config src-tauri/tauri.player.conf.json --config "$CFG"
          exe=src-tauri/target/release/duvarret; [ -f "$exe.exe" ] && exe="$exe.exe"
          npm run medir-ram -- "$exe" --segundos 40 --solo-medir --nombre "Página en blanco" --informe export-ci/memoria-blanco.json
      - uses: actions/upload-artifact@v4
        with:
          name: el-corazon-delator-${{ runner.os }}
          path: export-ci/native/*
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-${{ runner.os }}
          path: export-ci/memoria-*.json
