[package]
name = "duvarret"
version = "0.1.0"
description = "Duvarret — Director Agéntico de Literatura Polimórfica"
authors = ["Duvarret"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "duvarret_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# TLS del sistema (Schannel en Windows), sin incorporar una segunda biblioteca criptográfica.
# https://docs.rs/reqwest/latest/reqwest/#optional-features
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"

# Binario final ultraligero (< 20 MB): LTO, un solo codegen unit, sin símbolos.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
